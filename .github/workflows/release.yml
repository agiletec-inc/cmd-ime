name: Release to Homebrew

on:
  workflow_dispatch:

# Serialize releases — never run two release jobs at once, and never cancel
# one mid-flight (it pushes tags, a GitHub Release, and the cask PR).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache Swift build
        uses: actions/cache@v4
        with:
          path: apps/cmd-ime-swift/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('apps/cmd-ime-swift/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Determine version bump
        id: version
        run: |
          VERSION=$(awk -F'"' '/^version[[:space:]]*=/ {print $2; exit}' manifest.toml)
          if [ -z "$VERSION" ]; then
            echo "Failed to read version from manifest.toml" >&2
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Release version from manifest.toml: $VERSION"

      - name: Check if already released
        id: check_tag
        run: |
          if git rev-parse "v${{steps.version.outputs.version}}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️  Tag v${{steps.version.outputs.version}} already exists, skipping"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ Will create release v${{steps.version.outputs.version}}"
          fi

      # Independent idempotency check for the appcast phase. A run can die after
      # `gh release create` (tag now exists) but before the appcast asset upload
      # (network/permission failure) — a naive re-run would see the tag and skip
      # everything, leaving the release on GitHub forever invisible to Sparkle's
      # auto-update feed. The release asset is the new source of truth.
      - name: Check appcast entry status
        id: check_appcast
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"

          # A release can exist without its appcast asset after an interrupted
          # upload. A GitHub Release asset check is idempotent and does not
          # mistake the transitional appcast branch for the new source of truth.
          if [ "${{ steps.check_tag.outputs.exists }}" = "false" ]; then
            echo "missing=true" >> $GITHUB_OUTPUT
          else
            ASSETS=$(gh release view "v${VERSION}" --json assets --jq '.assets[].name') || {
              echo "::error::could not query GitHub Release v${VERSION} assets" >&2
              exit 1
            }
            if grep -Fxq 'appcast.xml' <<< "$ASSETS"; then
              echo "missing=false" >> $GITHUB_OUTPUT
              echo "✅ GitHub Release v${VERSION} already has appcast.xml"
            else
              echo "missing=true" >> $GITHUB_OUTPUT
              echo "⚠️  GitHub Release v${VERSION} has no appcast.xml asset"
            fi
          fi

      # Single source of truth for which step groups run. Three states:
      #   needs_build=true,  needs_appcast=true  — full run (tag missing)
      #   needs_build=false, needs_appcast=true  — recovery (tag exists, appcast entry missing)
      #   needs_build=false, needs_appcast=false — already fully published, skip everything
      - name: Decide release phase
        id: phase
        run: |
          set -euo pipefail
          if [ "${{ steps.check_tag.outputs.exists }}" = "false" ]; then
            NEEDS_BUILD=true
          else
            NEEDS_BUILD=false
          fi
          NEEDS_APPCAST="${{ steps.check_appcast.outputs.missing }}"

          echo "needs_build=$NEEDS_BUILD" >> $GITHUB_OUTPUT
          echo "needs_appcast=$NEEDS_APPCAST" >> $GITHUB_OUTPUT
          echo "🧭 needs_build=$NEEDS_BUILD needs_appcast=$NEEDS_APPCAST"

      # A self-signed code-signing certificate gives the bundle a stable
      # Designated Requirement (anchored to the cert SHA-1 + bundle id),
      # which is what macOS TCC uses to remember Accessibility grants
      # across `brew upgrade --cask cmd-ime`. Without this, ad-hoc signing
      # produces a per-cdhash DR and the user has to re-grant Accessibility
      # on every release. See Issue #23.
      #
      # The step is gated on the secret being present so a release does not
      # fail before the cert has been minted and uploaded to org secrets;
      # `package.sh` falls back to ad-hoc when CMDIME_SIGNING_IDENTITY is
      # empty. Once the cert is in place the Verify step below upgrades
      # silent ad-hoc fallback to a hard failure.
      - name: Check signing secret availability
        if: steps.phase.outputs.needs_build == 'true'
        id: signing
        env:
          CERT_P12_BASE64: ${{ secrets.CMDIME_SIGNING_CERT_P12_BASE64 }}
        run: |
          if [ -n "$CERT_P12_BASE64" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::warning::CMDIME_SIGNING_CERT_P12_BASE64 is not set; release will fall back to ad-hoc signing (TCC grants will reset on upgrade)"
          fi

      - name: Import code-signing certificate
        if: steps.phase.outputs.needs_build == 'true' && steps.signing.outputs.available == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.CMDIME_SIGNING_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CMDIME_SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/cmdime-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          CERT_PATH="$RUNNER_TEMP/cmdime-signing.p12"

          echo "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign

          # Allow codesign to use the imported key without a UI prompt
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Prepend our keychain to the user search list so codesign -s "<name>" resolves it
          EXISTING_KEYCHAINS=$(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS

          rm -f "$CERT_PATH"

      - name: Build macOS app
        if: steps.phase.outputs.needs_build == 'true'
        env:
          CMD_IME_VERSION: ${{ steps.version.outputs.version }}
          CMDIME_SIGNING_IDENTITY: ${{ vars.CMDIME_SIGNING_IDENTITY }}
          CMDIME_SPARKLE_PUBLIC_ED_KEY: ${{ vars.CMDIME_SPARKLE_PUBLIC_ED_KEY || secrets.CMDIME_SPARKLE_PUBLIC_ED_KEY }}
        run: |
          cd apps/cmd-ime-swift

          # Build using existing script (reads CMDIME_SIGNING_IDENTITY)
          bash scripts/package.sh

          # Copy to release directory
          mkdir -p ../../release
          cp -R .build/release/CmdIME.app ../../release/

      - name: Verify code signature
        if: steps.phase.outputs.needs_build == 'true'
        env:
          CMDIME_EXPECTED_TEAM_ID: ${{ vars.CMDIME_EXPECTED_TEAM_ID }}
        run: |
          set -euo pipefail
          codesign -dvv release/CmdIME.app 2>&1 | tee /tmp/codesign.log

          if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
            # Cert is configured: ad-hoc fallback would silently regress TCC stability
            if grep -q "Signature=adhoc" /tmp/codesign.log; then
              echo "ERROR: bundle ended up ad-hoc signed despite cert being configured (identity import failed)" >&2
              exit 1
            fi
            echo "OK: signed with stable identity"
          else
            echo "::warning::bundle is ad-hoc signed; expected because CMDIME_SIGNING_CERT_P12_BASE64 is not set"
          fi

          # Guard against a signing-team change. Sparkle rejects an update whose code
          # signature is from a different Apple team than the installed app, so a silent
          # team switch breaks auto-updates for every existing user (see v2.3.2 -> v2.4.0
          # where RYYXD43X4N -> X494AU8658 produced "An error occurred while running the
          # updater"). Fail the release before publishing if the team drifts.
          if [ -n "${CMDIME_EXPECTED_TEAM_ID:-}" ]; then
            ACTUAL_TEAM=$(sed -n 's/.*TeamIdentifier=\([A-Z0-9]*\).*/\1/p' /tmp/codesign.log | head -1)
            if [ "$ACTUAL_TEAM" != "$CMDIME_EXPECTED_TEAM_ID" ]; then
              echo "ERROR: signing TeamIdentifier '$ACTUAL_TEAM' != expected '$CMDIME_EXPECTED_TEAM_ID'." >&2
              echo "A team change breaks Sparkle auto-updates for existing users. Restore the prior" >&2
              echo "CMDIME_SIGNING_IDENTITY/cert, or — if the change is deliberate — bump the" >&2
              echo "CMDIME_EXPECTED_TEAM_ID repo variable (existing users will need a manual reinstall)." >&2
              exit 1
            fi
            echo "OK: TeamIdentifier matches expected ($CMDIME_EXPECTED_TEAM_ID)"
          fi

      - name: Check notarization availability
        if: steps.phase.outputs.needs_build == 'true'
        id: notarize
        env:
          _APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -n "$_APPLE_ID" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::warning::APPLE_ID is not set; skipping notarization"
          fi

      # Notarize and staple the .app BEFORE building the DMG, so the app a user
      # drags out of the DMG carries its own offline-verifiable ticket. notarytool
      # accepts a throwaway zip for submission and the ticket is keyed by the app's
      # cdhash, so stapling the on-disk bundle afterwards is valid. Previously the
      # DMG was built first and only the standalone app was stapled, leaving the
      # DMG's internal copy un-stapled — first launch then forced an online
      # Gatekeeper check (requires network). See #105.
      - name: Notarize and staple app
        if: steps.phase.outputs.needs_build == 'true' && steps.notarize.outputs.available == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          NOTARIZE_ZIP="$RUNNER_TEMP/notarize-app.zip"
          ditto -c -k --keepParent "release/CmdIME.app" "$NOTARIZE_ZIP"

          echo "🚀 Submitting app for notarization..."
          xcrun notarytool submit "$NOTARIZE_ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          echo "✅ Notarized! Stapling the app bundle..."
          xcrun stapler staple "release/CmdIME.app"

      - name: Create DMG
        if: steps.phase.outputs.needs_build == 'true'
        run: |
          VERSION=${{steps.version.outputs.version}}

          # Built from the app bundle stapled in the previous step (when
          # notarization ran), so the DMG's internal copy carries the ticket.
          hdiutil create -volname "CmdIME" \
            -srcfolder "release/CmdIME.app" \
            -ov -format UDZO \
            "cmd-ime-${VERSION}.dmg"

          echo "✅ DMG created: cmd-ime-${VERSION}.dmg"

      - name: Notarize and staple DMG
        if: steps.phase.outputs.needs_build == 'true' && steps.notarize.outputs.available == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          VERSION=${{steps.version.outputs.version}}
          DMG_PATH="cmd-ime-${VERSION}.dmg"

          echo "🚀 Submitting DMG for notarization..."
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          echo "✅ Notarization successful! Stapling the DMG..."
          xcrun stapler staple "$DMG_PATH"

      - name: Create ZIP
        if: steps.phase.outputs.needs_build == 'true'
        run: |
          VERSION=${{steps.version.outputs.version}}

          # Create ZIP from the stapled app so the Sparkle distribution carries the ticket.
          ditto -c -k --keepParent "release/CmdIME.app" "cmd-ime-${VERSION}.zip"

          echo "✅ ZIP created: cmd-ime-${VERSION}.zip"

      # Recovery path: the tag/release already exists but the appcast entry does
      # not (a prior run died between `gh release create` and the appcast push).
      # Rebuilding from source is unnecessary and risks producing a DMG/ZIP that
      # do not match the bytes already published in the GitHub release — download
      # the exact assets that were uploaded instead. They land at the same paths
      # ("cmd-ime-${VERSION}.dmg" / ".zip") the build steps above would have used,
      # so every step downstream is unaware of which path produced them.
      - name: Download existing release assets (recovery)
        if: steps.phase.outputs.needs_build == 'false' && steps.phase.outputs.needs_appcast == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"

          echo "♻️  Release v${VERSION} exists but the appcast entry is missing — downloading published assets instead of rebuilding"
          gh release download "v${VERSION}" \
            --pattern "cmd-ime-${VERSION}.dmg" \
            --pattern "cmd-ime-${VERSION}.zip" \
            --clobber

          ls -la "cmd-ime-${VERSION}.dmg" "cmd-ime-${VERSION}.zip"

      - name: Calculate SHA256
        if: steps.phase.outputs.needs_appcast == 'true'
        id: sha256
        run: |
          VERSION=${{steps.version.outputs.version}}
          SHA256=$(shasum -a 256 "cmd-ime-${VERSION}.dmg" | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "🔐 SHA256: $SHA256"

      # In the full-run path the Sparkle CLI tools are already resolved as a
      # side effect of "Build macOS app" (package.sh's `swift build`). In the
      # recovery path that step was skipped, so sign_update would otherwise be
      # missing. Resolve the Sparkle package artifacts on demand without
      # rebuilding the whole app (build is unnecessary for a tool invocation).
      - name: Resolve Sparkle CLI tools
        if: steps.phase.outputs.needs_appcast == 'true'
        run: |
          set -euo pipefail
          SIGN_UPDATE="$(pwd)/apps/cmd-ime-swift/.build/artifacts/sparkle/Sparkle/bin/sign_update"

          if [ -x "$SIGN_UPDATE" ]; then
            echo "✅ sign_update already available (built earlier in this run)"
            exit 0
          fi

          echo "📦 sign_update not found — resolving Sparkle package artifacts (recovery path)"
          (cd apps/cmd-ime-swift && swift package resolve)

          if [ ! -x "$SIGN_UPDATE" ]; then
            echo "⚙️  Still missing after 'swift package resolve' — falling back to a full package build"
            (cd apps/cmd-ime-swift && swift build -c release)
          fi

          if [ ! -x "$SIGN_UPDATE" ]; then
            echo "::error::sign_update still missing at $SIGN_UPDATE after resolve/build" >&2
            exit 1
          fi

      - name: Sign ZIP for Sparkle
        if: steps.phase.outputs.needs_appcast == 'true'
        id: sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.CMDIME_SPARKLE_PRIVATE_ED_KEY }}
        run: |
          set -euo pipefail
          VERSION=${{ steps.version.outputs.version }}
          ZIP_PATH="cmd-ime-${VERSION}.zip"
          SIGN_UPDATE="apps/cmd-ime-swift/.build/artifacts/sparkle/Sparkle/bin/sign_update"

          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::CMDIME_SPARKLE_PRIVATE_ED_KEY is not set — in-app updates will be broken"
            exit 1
          fi

          if [ ! -x "$SIGN_UPDATE" ]; then
            echo "::error::sign_update binary not found (or not executable) at $SIGN_UPDATE — the Sparkle package artifacts were not resolved" >&2
            exit 1
          fi

          KEY_FILE="$(mktemp "${RUNNER_TEMP}/sparkle-ed-key.XXXXXX.pem")"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          SIG=$("$SIGN_UPDATE" "$ZIP_PATH" -f "$KEY_FILE" \
            | grep -o 'sparkle:edSignature="[^"]*"' \
            | cut -d'"' -f2)

          if [ -z "$SIG" ]; then
            echo "::error::sign_update returned an empty signature for $ZIP_PATH — check CMDIME_SPARKLE_PRIVATE_ED_KEY and the sign_update invocation" >&2
            exit 1
          fi

          ZIP_SIZE=$(wc -c < "$ZIP_PATH" | tr -d '[:space:]')
          echo "edSignature=$SIG" >> $GITHUB_OUTPUT
          echo "zipSize=$ZIP_SIZE" >> $GITHUB_OUTPUT
          echo "🔐 EdDSA signature: $SIG"
          echo "📦 ZIP size: ${ZIP_SIZE} bytes"

      - name: Update appcast.xml
        if: steps.phase.outputs.needs_appcast == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          SIG="${{ steps.sparkle.outputs.edSignature }}"
          ZIP_SIZE="${{ steps.sparkle.outputs.zipSize }}"
          BUILD_NUMBER=$(echo "$VERSION" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
          PUB_DATE=$(date -u "+%a, %d %b %Y %H:%M:%S +0000")

          # GitHub Releases is the cumulative-feed input. Exclude drafts and
          # prereleases explicitly: `/releases/latest/` has the same stable
          # release semantics, and a draft/prerelease must never replace the
          # public feed. The appcast branch remains a transitional dual-publish
          # output for existing clients; it is not read here (see #137).
          APPCAST_DIR="$(mktemp -d)"
          APPCAST_INPUT="$APPCAST_DIR/appcast.xml"
          STABLE_RELEASES=$(gh release list --limit 100 --exclude-drafts --exclude-pre-releases \
            --json tagName --jq '.[].tagName') || {
            echo "::error::could not list stable GitHub Releases for the prior appcast" >&2
            exit 1
          }

          FOUND_RELEASE_ASSET=false
          while IFS= read -r RELEASE_TAG; do
            [ -n "$RELEASE_TAG" ] || continue
            ASSETS=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name') || {
              echo "::error::could not query assets for GitHub Release $RELEASE_TAG" >&2
              exit 1
            }
            if ! grep -Fxq 'appcast.xml' <<< "$ASSETS"; then
              continue
            fi
            gh release download "$RELEASE_TAG" --pattern appcast.xml --dir "$APPCAST_DIR" --clobber
            FOUND_RELEASE_ASSET=true
            echo "📥 Loaded accumulated appcast from stable GitHub Release $RELEASE_TAG"
            break
          done <<< "$STABLE_RELEASES"

          if [ "$FOUND_RELEASE_ASSET" = "false" ]; then
            if [ -n "$STABLE_RELEASES" ]; then
              echo "::error::stable GitHub Releases exist, but none has a non-empty appcast.xml asset" >&2
              exit 1
            fi
            cp appcast.xml "$APPCAST_INPUT"
            echo "📄 no stable GitHub Release exists — seeding from the in-repo template"
          fi

          if [ ! -s "$APPCAST_INPUT" ]; then
            echo "::error::prior appcast input is empty; refusing to overwrite the feed" >&2
            exit 1
          fi
          if ! grep -Fq '</channel>' "$APPCAST_INPUT"; then
            echo "::error::prior appcast input is not a valid feed; refusing to overwrite the feed" >&2
            exit 1
          fi

          if grep -Fq "<sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>" "$APPCAST_INPUT"; then
            cp "$APPCAST_INPUT" appcast.xml
            echo "✅ appcast.xml already contains v${VERSION}; keeping the prior feed byte-for-byte"
          else
            awk \
              -v ver="$VERSION" \
              -v sig="$SIG" \
              -v size="$ZIP_SIZE" \
              -v build="$BUILD_NUMBER" \
              -v date="$PUB_DATE" \
              '/    <\/channel>/ {
                printf "        <item>\n"
                printf "            <title>Version %s</title>\n", ver
                printf "            <pubDate>%s</pubDate>\n", date
                printf "            <sparkle:version>%s</sparkle:version>\n", build
                printf "            <sparkle:shortVersionString>%s</sparkle:shortVersionString>\n", ver
                printf "            <enclosure\n"
                printf "                url=\"https://github.com/agiletec-inc/cmd-ime/releases/download/v%s/cmd-ime-%s.zip\"\n", ver, ver
                printf "                sparkle:edSignature=\"%s\"\n", sig
                printf "                length=\"%s\"\n", size
                printf "                type=\"application/zip\" />\n"
                printf "        </item>\n"
              }
              { print }' \
              "$APPCAST_INPUT" > /tmp/appcast_new.xml

            if [ ! -s /tmp/appcast_new.xml ] || ! grep -Fq "<sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>" /tmp/appcast_new.xml; then
              echo "::error::generated appcast is empty or missing v${VERSION}; refusing to overwrite the feed" >&2
              exit 1
            fi
            mv /tmp/appcast_new.xml appcast.xml
          fi

          echo "✅ appcast.xml updated"
          cat appcast.xml

      - name: Create GitHub Release
        if: steps.phase.outputs.needs_build == 'true'
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          VERSION=${{steps.version.outputs.version}}

          echo "🚀 Creating GitHub Release v${VERSION}..."

          gh release create "v${VERSION}" \
            --title "Release v${VERSION}" \
            --generate-notes \
            "cmd-ime-${VERSION}.dmg" \
            "cmd-ime-${VERSION}.zip" \
            "appcast.xml"

          echo "✅ Release v${VERSION} created successfully!"

      # Recovery path: the release already exists but its appcast asset was
      # missing. Upload the validated cumulative feed without recreating the
      # release or changing its published binaries.
      - name: Upload appcast asset to existing GitHub Release
        if: steps.phase.outputs.needs_build == 'false' && steps.phase.outputs.needs_appcast == 'true'
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          test -s appcast.xml
          gh release upload "v${VERSION}" appcast.xml --clobber
          echo "✅ Uploaded appcast.xml to GitHub Release v${VERSION}"

      # Transitional dual-publish for existing clients that still use the old
      # branch URL. Keep this step until the measurable migration criteria in
      # #137 are met; the branch is intentionally not deleted in phase 1.
      - name: Publish appcast.xml to appcast branch
        if: steps.phase.outputs.needs_appcast == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=${{ steps.version.outputs.version }}

          WORKDIR=$(mktemp -d)
          cp appcast.xml "$WORKDIR/appcast.xml"
          cd "$WORKDIR"

          git init -q
          git checkout -q -b appcast
          git add appcast.xml
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "chore: publish appcast.xml for v${VERSION}"
          git push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            appcast

          echo "✅ appcast.xml published to the appcast branch"

      # Mint a 1-hour GitHub App installation token instead of using a
      # static PAT. The homebrew-publisher App is installed on
      # `homebrew-tap` only and shared via org-level credentials; same
      # pattern as airis-workspace's release.yml. This eliminates the
      # per-repo HOMEBREW_TAP_TOKEN PAT (which expires and breaks silently).
      - name: Generate Homebrew tap App token
        if: steps.phase.outputs.needs_appcast == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HOMEBREW_TAP_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_PUBLISHER_PRIVATE_KEY }}
          owner: agiletec-inc
          repositories: homebrew-tap
          # Least-privilege scope: only what's needed to push the cask
          # branch and open the PR. Survives any future App permission
          # expansion without auto-inheriting the larger set.
          permission-contents: write
          permission-pull-requests: write

      # Resolve the bot's numeric user-id so the committer email uses the
      # canonical `<id>+<slug>[bot]@users.noreply.github.com` form GitHub
      # recognizes as a verified author. Pulling `app-slug` from the token
      # outputs means renaming the App needs no workflow edits.
      - name: Resolve App bot identity
        if: steps.phase.outputs.needs_appcast == 'true'
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          SLUG="${{ steps.app-token.outputs.app-slug }}"
          USER_ID=$(gh api "/users/${SLUG}[bot]" --jq .id)
          {
            echo "name=${SLUG}[bot]"
            echo "email=${USER_ID}+${SLUG}[bot]@users.noreply.github.com"
          } >> "$GITHUB_OUTPUT"

      - name: Update Homebrew cask via PR
        if: steps.phase.outputs.needs_appcast == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          VERSION=${{steps.version.outputs.version}}
          SHA256=${{steps.sha256.outputs.sha256}}

          echo "📦 Updating Homebrew cask..."
          echo "   Version: $VERSION"
          echo "   SHA256: $SHA256"

          # Clone homebrew-tap with the App's installation token (shallow —
          # only a fresh branch with a single commit is pushed back)
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/agiletec-inc/homebrew-tap.git"
          cd homebrew-tap

          BRANCH="release/cmd-ime-v${VERSION}"

          # Rerun safety: drop any stale ref from a previous failed attempt
          gh api -X DELETE "repos/agiletec-inc/homebrew-tap/git/refs/heads/${BRANCH}" 2>/dev/null || true

          git checkout -b "$BRANCH"

          mkdir -p Casks

          cat > Casks/cmd-ime.rb <<EOF
          cask "cmd-ime" do
            version "${VERSION}"
            sha256 "${SHA256}"

            # The app updates itself via Sparkle; tell brew so it does not
            # treat a Sparkle-updated bundle as outdated and reinstall over it.
            auto_updates true

            url "https://github.com/agiletec-inc/cmd-ime/releases/download/v#{version}/cmd-ime-#{version}.dmg"
            name "⌘IME"
            desc "Command IME - Switch between alphanumeric and kana using Command keys"
            homepage "https://github.com/agiletec-inc/cmd-ime"

            livecheck do
              url :url
              strategy :github_latest
            end

            app "CmdIME.app"

            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-cr", "#{appdir}/CmdIME.app"],
                             sudo: false
              # Refresh LaunchServices so the new bundle's icon and display
              # name are picked up immediately (otherwise Finder / System
              # Settings can show a stale entry).
              lsregister = "/System/Library/Frameworks/CoreServices.framework/" \\
                           "Frameworks/LaunchServices.framework/Support/lsregister"
              system_command lsregister,
                             args: ["-f", "#{appdir}/CmdIME.app"],
                             sudo: false
              # Auto-launch the new build so the user doesn't have to fish
              # for it after every upgrade.
              system_command "/usr/bin/open",
                             args: ["#{appdir}/CmdIME.app"],
                             sudo: false
            end

            # Gracefully quit the running menu bar agent before brew replaces
            # the .app, then SIGTERM/SIGKILL as fallback. AppleScript "quit"
            # alone is unreliable for an LSUIElement app under load, so the
            # signal stanza catches the process even if AE delivery fails.
            uninstall quit:   "com.kazuki.cmdime",
                      signal: [
                        ["TERM", "com.kazuki.cmdime"],
                        ["KILL", "com.kazuki.cmdime"],
                      ]

            zap trash: [
              "~/Library/Application Support/cmd-ime",
              "~/Library/Preferences/com.kazuki.cmdime.plist",
            ]
          end
          EOF

          git config user.name  "${{ steps.bot.outputs.name }}"
          git config user.email "${{ steps.bot.outputs.email }}"

          git add Casks/cmd-ime.rb
          if git diff --cached --quiet; then
            echo "No changes to cask — skipping PR."
            exit 0
          fi
          git commit -m "Update cmd-ime to v${VERSION}"
          git push --set-upstream origin "$BRANCH"

          # Open and immediately squash-merge. The App is a bypass actor on
          # the `Homebrew tap protection` ruleset (bypass_mode: pull_request)
          # so the merge succeeds even with required reviews.
          PR_URL=$(gh pr create \
            --base "$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)" \
            --head "$BRANCH" \
            --title "chore(cask): update cmd-ime to v${VERSION}" \
            --body "Automated cask update from \`agiletec-inc/cmd-ime@v${VERSION}\`. The publisher App bypasses required-review enforcement; this PR merges immediately.")

          gh pr merge --squash --delete-branch "$PR_URL"

          echo "✅ Homebrew cask updated to v${VERSION}"
